apiVersion: v1
kind: Namespace
metadata:
  name: gisap-system
  labels:
    app.kubernetes.io/part-of: gisap
    tier: production
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gisap-backend
  namespace: gisap-system
  labels:
    app: gisap-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: gisap-backend
  template:
    metadata:
      labels:
        app: gisap-backend
    spec:
      containers:
        - name: backend
          image: gisap/backend:1.0.0-alpha
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: gisap-secrets
                  key: database-url
            - name: S3_ENDPOINT
              value: "http://minio-service.gisap-system.svc.cluster.local:9000"
            - name: REDIS_URL
              value: "redis://redis-service.gisap-system.svc.cluster.local:6379/0"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gisap-backend-service
  namespace: gisap-system
spec:
  type: ClusterIP
  selector:
    app: gisap-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
